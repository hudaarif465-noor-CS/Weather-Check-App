<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Check</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="weather-app">
    <header class="app-header">
      <div class="logo">☁</div>
      <div>
        <h1>Weather Check</h1>
        <p>Find the weather in your city</p>
      </div>
    </header>

    <form id="search-form" class="search-box">
      <input id="city-input" type="text" placeholder="Enter city name..." aria-label="City name" required>
      <button type="submit">Search</button>
    </form>

    <p id="message" class="message" role="status">Search for a city to see its weather.</p>

    <section id="weather-card" class="weather-card hidden" aria-live="polite">
      <div class="location-row">
        <div>
          <h2 id="city-name">City</h2>
          <p id="date-text"></p>
        </div>
        <span id="weather-icon" class="weather-icon">☀️</span>
      </div>

      <div class="temperature-row">
        <div id="temperature" class="temperature">--°</div>
        <div>
          <p id="condition" class="condition">Condition</p>
          <p class="muted">Feels like <span id="feels-like">--°</span></p>
        </div>
      </div>

      <div class="details">
        <div class="detail-item">
          <span class="detail-icon">💧</span>
          <div><strong id="humidity">--%</strong><small>Humidity</small></div>
        </div>
        <div class="detail-item">
          <span class="detail-icon">💨</span>
          <div><strong id="wind">-- km/h</strong><small>Wind speed</small></div>
        </div>
      </div>
    </section>

    <footer>Weather data provided by Open-Meteo</footer>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
